<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bl4sphxmy</title>
<meta name="description" content="Proyectos personales de @bl4sphxmy.">
<meta property="og:title" content="bl4sphxmy">
<meta property="og:description" content="Proyectos personales.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bl4sphxmy.github.io/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111110; --ink:#f0efec; --ink2:#a8a79d; --ink3:#6f6e66;
  --rule:#2a2a27; --accent:#f0efec;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Geist',system-ui,-apple-system,sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
main{width:100%; max-width:560px; margin:0 auto; padding:88px 24px 40px; flex:1}
h1{
  font-size:16px; font-weight:600; letter-spacing:-.01em; margin:0;
  font-family:'Geist Mono',ui-monospace,monospace;
}
.lede{color:var(--ink2); font-size:15px; margin:14px 0 0; max-width:42ch}
.rule{height:1px; background:var(--rule); margin:40px 0 0; border:0}
h2{
  font-family:'Geist Mono',ui-monospace,monospace;
  font-size:10.5px; font-weight:500; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink3); margin:36px 0 2px;
}
ul{list-style:none; margin:0; padding:0}
li{border-bottom:1px solid var(--rule)}
li:first-child{border-top:1px solid var(--rule)}
a.item{
  display:block; padding:18px 0; text-decoration:none; color:inherit;
  transition:padding-left .18s ease, color .18s ease;
}
a.item:hover,a.item:focus-visible{padding-left:7px; outline:none}
a.item:focus-visible .t{text-decoration:underline; text-underline-offset:3px}
.t{font-size:15.5px; font-weight:500}
.d{display:block; font-size:13.5px; color:var(--ink2); margin-top:3px}
.empty{
  color:var(--ink3); font-size:14px; padding:20px 0 0; margin:0;
  border-top:1px solid var(--rule);
}
footer{
  width:100%; max-width:560px; margin:0 auto; padding:0 24px 56px;
  font-size:13.5px; color:var(--ink3);
}
footer a{color:var(--ink2); text-decoration:none; border-bottom:1px solid var(--rule)}
footer a:hover{color:var(--ink); border-color:var(--ink3)}
@media (max-width:520px){ main{padding-top:56px} }
</style>
</head>
<body>
<main>
  <h1>bl4sphxmy</h1>
  <p class="lede">Cosas que hago por mi cuenta. Casi siempre fútbol, números y cosas que se pueden medir.</p>
  <hr class="rule">

  <h2>Proyectos</h2>
  <p class="empty">Todavía no hay nada publicado acá.</p>
</main>
<footer>
  <a href="https://twitter.com/bl4sphxmy" rel="me noopener">@bl4sphxmy en Twitter</a>
</footer>
</body>
</html>
